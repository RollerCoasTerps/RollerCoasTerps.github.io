<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
  #content {
    width: 640px;
    background: white;
    padding: 16px;
    box-sizing: border-box;
  }

  #pixelated {
    width: 640px;
    max-width: 100%;
    image-rendering: pixelated;
  }
</style>

<div id="content">
  <h1>RollerCoasTerps</h1>
  <p>We are a roller coaster and theme park club at UMD</p>
  <p>Meetings every other Tuesday at 7pm in Jimenez</p>
  <p>Follow us on social media</p>
  <a href="https://www.instagram.com/thrillridesumd/">Instagram</a>
  <a href="https://terplink.umd.edu/organization/thrillrides">TerpLink</a>
</div>

<canvas id="pixelated"></canvas>

<script>
  async function pixelate() {
    await document.fonts.ready;

    const content = document.querySelector("#content");
    const canvas = document.querySelector("#pixelated");

    const rendered = await html2canvas(content, {
      scale: 0.5,
      backgroundColor: "#ffffff"
    });

    canvas.width = rendered.width;
    canvas.height = rendered.height;
    canvas.getContext("2d").drawImage(rendered, 0, 0);

    content.style.display = "none";
  }

  pixelate();
</script>
